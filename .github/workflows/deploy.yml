name: Build and deploy to Minikube

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Set up/start Minikube and apply infrastructure before deploying
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pz2-minikube
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, pz2]
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Normalize script and properties line endings
        shell: bash
        run: |
          set -euo pipefail
          echo "Checked-out commit:"
          git rev-parse HEAD
          python3 - <<'PYTHON'
          from pathlib import Path

          for path in [*Path("scripts").glob("*.sh"), Path("app/gradlew"), *Path("app").rglob("*.properties")]:
              data = path.read_bytes()
              count = data.count(b"\r\n")
              path.write_bytes(data.replace(b"\r\n", b"\n"))
              print(f"{path}: normalized {count} CRLF line endings")
          PYTHON

      - name: Validate scripts and manifests
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          kubectl kustomize k8s > /dev/null

      - name: Test deployment scripts without a cluster
        run: python3 -m unittest discover -s tests -p 'test_deployment_scripts.py'

      - name: Bootstrap cluster and infrastructure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        run: bash scripts/bootstrap.sh

      - name: Build images and deploy
        run: bash scripts/deploy.sh

      - name: Verify the deployment
        run: bash scripts/verify.sh

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl --context=minikube -n pz2 get pods,deployments,services -o wide
          kubectl --context=minikube -n pz2 get events --sort-by=.metadata.creationTimestamp
