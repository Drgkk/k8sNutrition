apiVersion: v1
kind: Service
metadata:
  name: nutrition-v1
spec:
  type: ClusterIP
  selector:
    app: nutrition
    version: v1
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nutrition-v2
spec:
  type: ClusterIP
  selector:
    app: nutrition
    version: v2
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
